[package]
name = "hostkeep"
version = "0.2.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Terminal UI editor for /etc/hosts: toggle, group and edit entries safely, with backups and diff preview"
repository = "https://github.com/volodymyr-malishevskyi/hostkeep"
homepage = "https://github.com/volodymyr-malishevskyi/hostkeep"
readme = "README.md"
keywords = ["hosts", "etc-hosts", "tui", "dns", "cli"]
categories = ["command-line-utilities"]
exclude = ["assets/", "docs/", ".github/", "dist-workspace.toml", "release.toml"]

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
fluent-templates = "0.15.1"
libc = "0.2.191"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
similar = "3.2.1"
sys-locale = "0.3.2"
tempfile = "3.27.0"
toml = "1.1.8"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
